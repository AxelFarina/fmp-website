<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FMP · Laboratorio de fondos animados</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Archivo', sans-serif; background: #fff; color: #0F2A44; overflow: hidden; }
  .stage { position: fixed; inset: 0; }
  canvas, .fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero-mock {
    position: relative; z-index: 5; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px; pointer-events: none;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.85); backdrop-filter: blur(6px);
    border: 1px solid rgba(27,117,183,.3); border-radius: 999px; padding: 7px 16px; font-size: 13px;
    box-shadow: 0 6px 18px rgba(11,42,74,.06); margin-bottom: 24px;
  }
  h1 { font-weight: 600; font-size: clamp(34px, 4.5vw, 60px); letter-spacing: -2px; margin: 0 0 18px; color: #0B2239; max-width: 800px; }
  .grad { background: linear-gradient(90deg, #1B75B7, #46BDEB); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: 16px; line-height: 1.65; color: rgba(15,42,68,.6); max-width: 540px; margin: 0 0 30px; }
  .btns { display: flex; gap: 12px; }
  .b1 { padding: 13px 26px; border-radius: 999px; background: linear-gradient(135deg,#1B75B7,#46BDEB); color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(27,117,183,.35); }
  .b2 { padding: 13px 26px; border-radius: 999px; background: #fff; border: 1px solid rgba(11,42,74,.16); font-size: 14px; font-weight: 500; }

  .switcher {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 50;
    display: flex; gap: 6px; padding: 6px; border-radius: 999px; flex-wrap: wrap; justify-content: center;
    background: rgba(4,24,46,.92); backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(4,24,46,.4);
  }
  .switcher button {
    border: none; cursor: pointer; border-radius: 999px; padding: 10px 18px;
    font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 600;
    background: transparent; color: rgba(235,245,252,.7); transition: all .25s ease;
  }
  .switcher button.on { background: linear-gradient(135deg,#1B75B7,#46BDEB); color: #fff; }
  .tag {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 50;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 3px; color: #1B75B7;
    background: rgba(255,255,255,.9); border: 1px solid rgba(27,117,183,.3); border-radius: 999px; padding: 8px 20px;
  }
  /* demo 2: aurora css */
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; }
  @keyframes drift1 { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(24vw,10vh) scale(1.25); } 100% { transform: translate(-6vw,20vh) scale(.95); } }
  @keyframes drift2 { 0% { transform: translate(0,0) scale(1.1); } 50% { transform: translate(-20vw,-8vh) scale(.9); } 100% { transform: translate(10vw,-16vh) scale(1.2); } }
  @keyframes drift3 { 0% { transform: translate(0,0) scale(.9); } 50% { transform: translate(12vw,-14vh) scale(1.15); } 100% { transform: translate(-16vw,6vh) scale(1); } }
</style>
</head>
<body>
  <div class="tag" id="tag">1 · RED NEURONAL</div>
  <div class="stage" id="stage"></div>

  <div class="hero-mock">
    <div class="badge">✦ Partner Oficial de SAP · República Dominicana</div>
    <h1>Da el paso hacia el éxito <span class="grad">con FMP y SAP.</span></h1>
    <p class="sub">En FMP estamos comprometidos con ayudarte a alcanzar tus objetivos a través de la implementación de soluciones SAP de vanguardia.</p>
    <div class="btns"><span class="b1">Agenda tu cita</span><span class="b2">Ver productos</span></div>
  </div>

  <div class="switcher">
    <button data-i="0" class="on">1 · Red neuronal</button>
    <button data-i="1">2 · Aurora viva</button>
    <button data-i="2">3 · Puntos reactivos</button>
    <button data-i="3">4 · Ondas de datos</button>

    <button data-i="6">7 · Enjambre</button>
    <button data-i="7">8 · Líquido</button>
    <button data-i="8">9 · Tipografía</button>
    <button data-i="9">10 · Wireframe 3D</button>
    <button data-i="10">11 · Tinta</button>
    <button data-i="11">12 · Topografía</button>
    <button data-i="12">13 · Caminos</button>
    <button data-i="13">14 · Beams</button>
    <button data-i="14">15 · Flujo ERP</button>
    <button data-i="15">16 · Halftone</button>
    <button data-i="16">17 · Órbitas</button>
    <button data-i="17">18 · Blueprint</button>
    <button data-i="18">19 · HUD</button>
    <button data-i="19">20 · Escáner</button>
    <button data-i="20">21 · Profundidad</button>
    <button data-i="21">22 · Holograma</button>
  </div>

<script>
const stage = document.getElementById('stage')
const tag = document.getElementById('tag')
let raf = null, cleanup = null
const mouse = { x: -9999, y: -9999 }
addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY })

function makeCanvas() {
  const c = document.createElement('canvas')
  const fit = () => { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio }
  fit(); addEventListener('resize', fit)
  stage.appendChild(c)
  const ctx = c.getContext('2d')
  return { c, ctx }
}
const W = () => innerWidth, H = () => innerHeight

/* 1 — Red neuronal: nodos que derivan + líneas que se conectan, reacciona al cursor */
function neural() {
  const { ctx } = makeCanvas()
  const N = Math.min(90, Math.floor(W() * H() / 16000))
  const pts = Array.from({ length: N }, () => ({
    x: Math.random() * W(), y: Math.random() * H(),
    vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
  }))
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy
      if (p.x < 0 || p.x > W()) p.vx *= -1
      if (p.y < 0 || p.y > H()) p.vy *= -1
      const dm = Math.hypot(p.x - mouse.x, p.y - mouse.y)
      if (dm < 140) { p.x += (p.x - mouse.x) / dm * .6; p.y += (p.y - mouse.y) / dm * .6 }
    }
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y)
      if (d < 150) {
        ctx.strokeStyle = `rgba(27,117,183,${(.22 * (1 - d / 150)).toFixed(3)})`
        ctx.lineWidth = 1
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke()
      }
    }
    for (const p of pts) {
      ctx.fillStyle = 'rgba(27,117,183,.5)'
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill()
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 2 — Aurora viva: blobs de gradiente que fluyen lentamente (CSS puro, súper liviano) */
function aurora() {
  const mk = (w, h, x, y, c, anim, dur) => {
    const b = document.createElement('div')
    b.className = 'blob'
    b.style.cssText = `width:${w}px;height:${h}px;left:${x};top:${y};background:radial-gradient(closest-side,${c},transparent 70%);animation:${anim} ${dur}s ease-in-out infinite alternate`
    stage.appendChild(b)
  }
  mk(700, 600, '-10%', '-20%', 'rgba(70,189,235,.5)', 'drift1', 16)
  mk(600, 550, '60%', '10%', 'rgba(27,117,183,.35)', 'drift2', 20)
  mk(500, 500, '30%', '55%', 'rgba(70,189,235,.32)', 'drift3', 24)
  mk(400, 420, '75%', '60%', 'rgba(0,28,65,.16)', 'drift1', 28)
}

/* 3 — Puntos reactivos: cuadrícula que se ilumina cerca del cursor */
function dots() {
  const { ctx } = makeCanvas()
  const GAP = 34
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const t = performance.now() / 1000
    for (let x = GAP / 2; x < W(); x += GAP) for (let y = GAP / 2; y < H(); y += GAP) {
      const dm = Math.hypot(x - mouse.x, y - mouse.y)
      const wave = Math.sin(t * 1.4 + x / 90 + y / 130) * .5 + .5
      let r = 1.1 + wave * .7, a = .12 + wave * .1
      if (dm < 160) { const k = 1 - dm / 160; r += k * 2.6; a += k * .55 }
      ctx.fillStyle = `rgba(27,117,183,${a.toFixed(3)})`
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill()
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 4 — Ondas de datos: líneas sinusoidales fluyendo (estilo streams) */
function waves() {
  const { ctx } = makeCanvas()
  const LINES = 7
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const t = performance.now() / 1000
    for (let l = 0; l < LINES; l++) {
      const yBase = H() * (.18 + l * .11)
      const amp = 26 + l * 7, speed = .35 + l * .08
      ctx.strokeStyle = `rgba(${l % 2 ? '70,189,235' : '27,117,183'},${(.28 - l * .025).toFixed(3)})`
      ctx.lineWidth = 1.6
      ctx.beginPath()
      for (let x = 0; x <= W(); x += 8) {
        const y = yBase + Math.sin(x / 160 + t * speed + l * 1.4) * amp + Math.sin(x / 57 + t * (speed * 1.7)) * (amp * .3)
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)
      }
      ctx.stroke()
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 5 — Orbes flotantes: esferas suaves subiendo con profundidad */
function orbs() {
  const { ctx } = makeCanvas()
  const N = 26
  const os = Array.from({ length: N }, () => ({
    x: Math.random() * W(), y: Math.random() * H(),
    r: 4 + Math.random() * 26, v: .2 + Math.random() * .55, ph: Math.random() * 7,
  }))
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const t = performance.now() / 1000
    for (const o of os) {
      o.y -= o.v
      if (o.y < -40) { o.y = H() + 40; o.x = Math.random() * W() }
      const x = o.x + Math.sin(t + o.ph) * 18
      const g = ctx.createRadialGradient(x, o.y, 0, x, o.y, o.r)
      g.addColorStop(0, `rgba(70,189,235,${(.35 * (o.r / 30)).toFixed(3)})`)
      g.addColorStop(1, 'rgba(70,189,235,0)')
      ctx.fillStyle = g
      ctx.beginPath(); ctx.arc(x, o.y, o.r, 0, 7); ctx.fill()
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 6 — Warp: viaje a velocidad luz, estrellas azules estirándose hacia ti */
function warp() {
  const { ctx } = makeCanvas()
  const N = 240
  const stars = Array.from({ length: N }, () => ({
    x: (Math.random() - .5) * W() * 2, y: (Math.random() - .5) * H() * 2, z: Math.random() * 900 + 100,
  }))
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const cx = W() / 2, cy = H() / 2, f = 320
    for (const s of stars) {
      const pz = s.z
      s.z -= 5.5
      if (s.z < 20) { s.x = (Math.random() - .5) * W() * 2; s.y = (Math.random() - .5) * H() * 2; s.z = 1000 }
      const x1 = cx + s.x * (f / pz), y1 = cy + s.y * (f / pz)
      const x2 = cx + s.x * (f / s.z), y2 = cy + s.y * (f / s.z)
      const a = Math.min(.7, (1000 - s.z) / 1000)
      ctx.strokeStyle = `rgba(${s.z % 2 < 1 ? '27,117,183' : '70,189,235'},${a.toFixed(3)})`
      ctx.lineWidth = Math.max(.6, (1000 - s.z) / 380)
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke()
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 7 — Enjambre: bandada de partículas que vuela en grupo y esquiva el cursor */
function boids() {
  const { ctx } = makeCanvas()
  const N = 90
  const bs = Array.from({ length: N }, () => ({
    x: Math.random() * W(), y: Math.random() * H(),
    vx: (Math.random() - .5) * 2, vy: (Math.random() - .5) * 2,
  }))
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    for (const b of bs) {
      let ax = 0, ay = 0, cxm = 0, cym = 0, sx = 0, sy = 0, n = 0
      for (const o of bs) {
        if (o === b) continue
        const d = Math.hypot(o.x - b.x, o.y - b.y)
        if (d < 90) {
          ax += o.vx; ay += o.vy; cxm += o.x; cym += o.y; n++
          if (d < 26) { sx += (b.x - o.x) / d; sy += (b.y - o.y) / d }
        }
      }
      if (n) {
        b.vx += (ax / n - b.vx) * .04 + (cxm / n - b.x) * .0016 + sx * .12
        b.vy += (ay / n - b.vy) * .04 + (cym / n - b.y) * .0016 + sy * .12
      }
      const dm = Math.hypot(b.x - mouse.x, b.y - mouse.y)
      if (dm < 150) { b.vx += (b.x - mouse.x) / dm * .5; b.vy += (b.y - mouse.y) / dm * .5 }
      const sp = Math.hypot(b.vx, b.vy) || 1
      const max = 2.6, min = 1.1
      if (sp > max) { b.vx = b.vx / sp * max; b.vy = b.vy / sp * max }
      if (sp < min) { b.vx = b.vx / sp * min; b.vy = b.vy / sp * min }
      b.x = (b.x + b.vx + W()) % W(); b.y = (b.y + b.vy + H()) % H()
      const ang = Math.atan2(b.vy, b.vx)
      ctx.fillStyle = 'rgba(27,117,183,.55)'
      ctx.beginPath()
      ctx.moveTo(b.x + Math.cos(ang) * 7, b.y + Math.sin(ang) * 7)
      ctx.lineTo(b.x + Math.cos(ang + 2.6) * 4.5, b.y + Math.sin(ang + 2.6) * 4.5)
      ctx.lineTo(b.x + Math.cos(ang - 2.6) * 4.5, b.y + Math.sin(ang - 2.6) * 4.5)
      ctx.fill()
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 8 — Líquido: metaballs gooey que se funden entre sí (truco blur+contraste) */
function goo() {
  const wrap = document.createElement('div')
  wrap.className = 'fx'
  wrap.style.cssText = 'background:#fff;filter:blur(22px) contrast(22);overflow:hidden'
  const balls = []
  for (let i = 0; i < 9; i++) {
    const d = 90 + Math.random() * 160
    const el = document.createElement('div')
    el.style.cssText = `position:absolute;width:${d}px;height:${d}px;border-radius:50%;background:#2E9FDD`
    wrap.appendChild(el)
    balls.push({ el, d, ph: Math.random() * 7, sp: .3 + Math.random() * .5, rx: .18 + Math.random() * .32, ry: .14 + Math.random() * .3 })
  }
  stage.appendChild(wrap)
  const tick = () => {
    const t = performance.now() / 1000
    for (const b of balls) {
      const x = W() * .5 + Math.cos(t * b.sp + b.ph) * W() * b.rx - b.d / 2
      const y = H() * .5 + Math.sin(t * b.sp * 1.3 + b.ph * 2) * H() * b.ry - b.d / 2
      b.el.style.transform = `translate(${x}px,${y}px)`
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 9 — Tipografía cinética: muro de palabras gigantes en movimiento */
function typo() {
  const wrap = document.createElement('div')
  wrap.className = 'fx'
  wrap.style.cssText = 'overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:1.2vw;transform:rotate(-4deg) scale(1.15)'
  const rows = [
    { words: 'SAP · ERP · S/4HANA · BUSINESS ONE · ', dur: 38, dir: 1, fill: false },
    { words: '+25 AÑOS · +500 EMPRESAS · +9,000 SERVICIOS · ', dur: 30, dir: -1, fill: true },
    { words: 'NÓMINA · FACTURACIÓN · CLOUD · ADD-ONS · ', dur: 44, dir: 1, fill: false },
    { words: 'PARTNER OFICIAL DE SAP · REPÚBLICA DOMINICANA · ', dur: 34, dir: -1, fill: true },
    { words: 'IMPLEMENTACIÓN · SOPORTE 24H · GO-LIVE · ', dur: 40, dir: 1, fill: false },
  ]
  if (!document.getElementById('typo-kf')) {
    const st = document.createElement('style')
    st.id = 'typo-kf'
    st.textContent = '@keyframes slideL { from { transform: translateX(0); } to { transform: translateX(-50%); } } @keyframes slideR { from { transform: translateX(-50%); } to { transform: translateX(0); } }'
    document.head.appendChild(st)
  }
  for (const r of rows) {
    const row = document.createElement('div')
    row.style.cssText = 'white-space:nowrap;display:flex;width:max-content'
    const mk = () => {
      const s = document.createElement('span')
      s.textContent = r.words.repeat(6)
      s.style.cssText = `font-family:'Archivo Black',sans-serif;font-size:6.5vw;letter-spacing:-1px;padding-right:2vw;` +
        (r.fill ? 'color:rgba(70,189,235,.10)' : 'color:transparent;-webkit-text-stroke:1.5px rgba(27,117,183,.22)')
      return s
    }
    row.appendChild(mk()); row.appendChild(mk())
    row.style.animation = `${r.dir > 0 ? 'slideL' : 'slideR'} ${r.dur}s linear infinite`
    wrap.appendChild(row)
  }
  const veil = document.createElement('div')
  veil.className = 'fx'
  veil.style.cssText = 'background:radial-gradient(closest-side at 50% 50%, rgba(255,255,255,.92), rgba(255,255,255,.55) 55%, rgba(255,255,255,0) 90%)'
  stage.appendChild(wrap)
  stage.appendChild(veil)
}

/* 10 — Wireframe 3D: icosaedro girando con vértices brillantes + anillo de partículas */
function wire3d() {
  const { ctx } = makeCanvas()
  const t0 = (1 + Math.sqrt(5)) / 2
  let V = [[-1,t0,0],[1,t0,0],[-1,-t0,0],[1,-t0,0],[0,-1,t0],[0,1,t0],[0,-1,-t0],[0,1,-t0],[t0,0,-1],[t0,0,1],[-t0,0,-1],[-t0,0,1]]
  const Emap = new Set()
  const F = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]]
  for (const f of F) for (let i = 0; i < 3; i++) {
    const a = f[i], b = f[(i + 1) % 3]
    Emap.add(a < b ? a + '-' + b : b + '-' + a)
  }
  const E = [...Emap].map(s => s.split('-').map(Number))
  const RING = Array.from({ length: 60 }, (_, i) => i / 60 * Math.PI * 2)
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const t = performance.now() / 1000
    const cx = W() * .5, cy = H() * .46, R = Math.min(W(), H()) * .30
    const rot = (p) => {
      let [x, y, z] = p
      const a = t * .35, b = t * .22
      let x1 = x * Math.cos(a) - z * Math.sin(a), z1 = x * Math.sin(a) + z * Math.cos(a)
      let y1 = y * Math.cos(b) - z1 * Math.sin(b), z2 = y * Math.sin(b) + z1 * Math.cos(b)
      return [x1, y1, z2]
    }
    const proj = (p) => {
      const [x, y, z] = p
      const s = 2.6 / (4 - z)
      return [cx + x * R * s, cy + y * R * s, s]
    }
    const P = V.map(v => proj(rot(v.map(n => n / t0))))
    for (const [a, b] of E) {
      ctx.strokeStyle = `rgba(27,117,183,${(.14 + Math.min(P[a][2], P[b][2]) * .28).toFixed(3)})`
      ctx.lineWidth = 1.2
      ctx.beginPath(); ctx.moveTo(P[a][0], P[a][1]); ctx.lineTo(P[b][0], P[b][1]); ctx.stroke()
    }
    for (const [x, y, s] of P) {
      ctx.fillStyle = `rgba(70,189,235,${(.35 + s * .4).toFixed(3)})`
      ctx.beginPath(); ctx.arc(x, y, 2 + s * 2.6, 0, 7); ctx.fill()
    }
    for (const a of RING) {
      const p = proj(rot([Math.cos(a + t * .5) * 1.55, Math.sin(a + t * .5) * .22, Math.sin(a + t * .5) * 1.55]))
      ctx.fillStyle = `rgba(27,117,183,${(.1 + p[2] * .3).toFixed(3)})`
      ctx.beginPath(); ctx.arc(p[0], p[1], 1.4 + p[2], 0, 7); ctx.fill()
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 11 — Tinta: el cursor deja estelas de tinta azul que se disuelven (se mueve solo si no hay mouse) */
function ink() {
  const { c, ctx } = makeCanvas()
  c.style.filter = 'blur(6px)'
  let last = { x: W() / 2, y: H() / 2 }
  let lastMove = 0
  addEventListener('mousemove', () => { lastMove = performance.now() })
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    // fade previo (disolución)
    ctx.globalCompositeOperation = 'destination-out'
    ctx.fillStyle = 'rgba(255,255,255,.03)'
    ctx.fillRect(0, 0, W(), H())
    ctx.globalCompositeOperation = 'source-over'
    const t = performance.now()
    // fantasma: si el mouse está quieto, la tinta pasea sola
    let tx = mouse.x, ty = mouse.y
    if (t - lastMove > 1800 || mouse.x < 0) {
      tx = W() / 2 + Math.sin(t / 1700) * W() * .33 + Math.sin(t / 730) * 60
      ty = H() / 2 + Math.cos(t / 2100) * H() * .3 + Math.cos(t / 570) * 40
    }
    const dx = tx - last.x, dy = ty - last.y
    const dist = Math.hypot(dx, dy)
    const steps = Math.max(1, Math.floor(dist / 6))
    for (let i = 0; i < steps; i++) {
      const x = last.x + dx * (i / steps), y = last.y + dy * (i / steps)
      const r = 10 + Math.min(26, dist * .4) * Math.random()
      const g = ctx.createRadialGradient(x, y, 0, x, y, r)
      const hue = Math.random() > .5 ? '27,117,183' : '70,189,235'
      g.addColorStop(0, `rgba(${hue},.30)`)
      g.addColorStop(1, `rgba(${hue},0)`)
      ctx.fillStyle = g
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill()
    }
    last = { x: tx, y: ty }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 12 — Topografía luminosa: curvas de nivel que respiran (inspirado en Topo Field) */
function topo() {
  const { ctx } = makeCanvas()
  const peaks = [
    { x: .28, y: .38, s: 1 }, { x: .74, y: .3, s: .8 }, { x: .55, y: .78, s: .9 },
  ]
  const field = (x, y, t) => {
    let v = 0
    for (const p of peaks) {
      const dx = x - p.x * W() - Math.sin(t * .3 + p.s * 5) * 40
      const dy = y - p.y * H() - Math.cos(t * .22 + p.s * 3) * 30
      v += p.s * Math.exp(-(dx * dx + dy * dy) / (2 * (W() * .22) ** 2))
    }
    return v
  }
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const t = performance.now() / 1000
    const STEP = 14
    for (let lvl = 1; lvl <= 9; lvl++) {
      const iso = lvl * .1
      ctx.strokeStyle = `rgba(27,117,183,${(.06 + lvl * .028).toFixed(3)})`
      ctx.lineWidth = lvl % 3 === 0 ? 1.6 : .9
      ctx.beginPath()
      // marching squares (solo segmentos horizontales aproximados para rendimiento)
      for (let y = 0; y < H(); y += STEP) for (let x = 0; x < W(); x += STEP) {
        const a = field(x, y, t), b = field(x + STEP, y, t), c = field(x, y + STEP, t)
        if ((a - iso) * (b - iso) < 0) {
          const k = (iso - a) / (b - a)
          ctx.moveTo(x + STEP * k, y); ctx.lineTo(x + STEP * k, y + STEP * .9)
        } else if ((a - iso) * (c - iso) < 0) {
          const k = (iso - a) / (c - a)
          ctx.moveTo(x, y + STEP * k); ctx.lineTo(x + STEP * .9, y + STEP * k)
        }
      }
      ctx.stroke()
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 13 — Caminos flotantes: haz de curvas elegantes con pulsos de luz (inspirado en Floating Paths) */
function paths() {
  const { ctx } = makeCanvas()
  const N = 26
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const t = performance.now() / 1000
    for (let i = 0; i < N; i++) {
      const k = i / N
      const y0 = H() * (.15 + k * .8), y1 = H() * (.05 + k * .55)
      const bend = Math.sin(t * .25 + i * .4) * 60
      ctx.strokeStyle = `rgba(${i % 3 ? '27,117,183' : '70,189,235'},${(.05 + k * .12).toFixed(3)})`
      ctx.lineWidth = .8 + k * 1.6
      ctx.beginPath()
      ctx.moveTo(-60, y0)
      ctx.bezierCurveTo(W() * .3, y0 - 120 + bend, W() * .62, y1 + 150 - bend, W() + 60, y1)
      ctx.stroke()
      // pulso viajero
      if (i % 4 === 0) {
        const p = ((t * .12 + i * .13) % 1)
        const mt = 1 - p
        const px = mt ** 3 * -60 + 3 * mt * mt * p * W() * .3 + 3 * mt * p * p * W() * .62 + p ** 3 * (W() + 60)
        const py = mt ** 3 * y0 + 3 * mt * mt * p * (y0 - 120 + bend) + 3 * mt * p * p * (y1 + 150 - bend) + p ** 3 * y1
        const g = ctx.createRadialGradient(px, py, 0, px, py, 26)
        g.addColorStop(0, 'rgba(70,189,235,.5)'); g.addColorStop(1, 'rgba(70,189,235,0)')
        ctx.fillStyle = g
        ctx.beginPath(); ctx.arc(px, py, 26, 0, 7); ctx.fill()
      }
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 14 — Beams con colisión: rayos que caen y estallan en el suelo (inspirado en Background Beams With Collision) */
function beams() {
  const { ctx } = makeCanvas()
  const floorY = () => H() * .78
  const bs = Array.from({ length: 7 }, (_, i) => ({
    x: (i + .5) / 7 * W() + (Math.random() - .5) * 60,
    y: Math.random() * -H(), v: 3 + Math.random() * 4, len: 90 + Math.random() * 120,
  }))
  const booms = []
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    // línea de suelo sutil
    ctx.strokeStyle = 'rgba(27,117,183,.14)'
    ctx.lineWidth = 1
    ctx.beginPath(); ctx.moveTo(0, floorY()); ctx.lineTo(W(), floorY()); ctx.stroke()
    for (const b of bs) {
      b.y += b.v
      const g = ctx.createLinearGradient(b.x, b.y - b.len, b.x, b.y)
      g.addColorStop(0, 'rgba(70,189,235,0)')
      g.addColorStop(1, 'rgba(27,117,183,.75)')
      ctx.strokeStyle = g
      ctx.lineWidth = 2.4
      ctx.beginPath(); ctx.moveTo(b.x, Math.max(0, b.y - b.len)); ctx.lineTo(b.x, Math.min(b.y, floorY())); ctx.stroke()
      if (b.y >= floorY()) {
        for (let i = 0; i < 12; i++) {
          const a = -Math.PI * Math.random()
          booms.push({ x: b.x, y: floorY(), vx: Math.cos(a) * (1 + Math.random() * 3), vy: Math.sin(a) * (1 + Math.random() * 3), life: 1 })
        }
        b.y = -b.len - Math.random() * H() * .5
        b.x = Math.random() * W()
      }
    }
    for (let i = booms.length - 1; i >= 0; i--) {
      const p = booms[i]
      p.x += p.vx; p.y += p.vy; p.vy += .06; p.life -= .02
      if (p.life <= 0) { booms.splice(i, 1); continue }
      ctx.fillStyle = `rgba(70,189,235,${(p.life * .7).toFixed(3)})`
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2 * p.life + .6, 0, 7); ctx.fill()
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 15 — Flujo ERP (original FMP): documentos viajando entre módulos del negocio */
function erpflow() {
  const { ctx } = makeCanvas()
  const nodes = () => [
    { x: W() * .12, y: H() * .22, l: 'VENTAS' },
    { x: W() * .86, y: H() * .18, l: 'INVENTARIO' },
    { x: W() * .08, y: H() * .74, l: 'NÓMINA' },
    { x: W() * .5, y: H() * .88, l: 'FINANZAS' },
    { x: W() * .9, y: H() * .7, l: 'DGII ✓' },
  ]
  const routes = [[0, 3], [1, 3], [2, 3], [3, 4], [0, 1]]
  const docs = routes.flatMap((r, i) => [{ r, p: (i * .23) % 1, sp: .0016 + Math.random() * .0018 }, { r, p: (i * .23 + .5) % 1, sp: .0016 + Math.random() * .0018 }])
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const N = nodes()
    ctx.font = '600 11px "IBM Plex Mono", monospace'
    for (const [a, b] of routes) {
      const A = N[a], B = N[b]
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2 - 70
      ctx.strokeStyle = 'rgba(27,117,183,.16)'
      ctx.lineWidth = 1.4
      ctx.setLineDash([5, 7])
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.quadraticCurveTo(mx, my, B.x, B.y); ctx.stroke()
      ctx.setLineDash([])
    }
    for (const d of docs) {
      d.p += d.sp
      if (d.p > 1) d.p = 0
      const A = N[d.r[0]], B = N[d.r[1]]
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2 - 70
      const mt = 1 - d.p
      const x = mt * mt * A.x + 2 * mt * d.p * mx + d.p * d.p * B.x
      const y = mt * mt * A.y + 2 * mt * d.p * my + d.p * d.p * B.y
      ctx.fillStyle = 'rgba(255,255,255,.95)'
      ctx.strokeStyle = 'rgba(27,117,183,.7)'
      ctx.lineWidth = 1.3
      const r = 4
      ctx.beginPath()
      ctx.roundRect(x - 8, y - 10, 16, 20, r)
      ctx.fill(); ctx.stroke()
      ctx.strokeStyle = 'rgba(70,189,235,.9)'
      ctx.beginPath(); ctx.moveTo(x - 4, y - 4); ctx.lineTo(x + 4, y - 4); ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y); ctx.moveTo(x - 4, y + 4); ctx.lineTo(x + 1, y + 4); ctx.stroke()
    }
    for (const n of N) {
      const w = ctx.measureText(n.l).width + 26
      ctx.fillStyle = 'rgba(255,255,255,.92)'
      ctx.strokeStyle = 'rgba(27,117,183,.4)'
      ctx.lineWidth = 1.2
      ctx.beginPath(); ctx.roundRect(n.x - w / 2, n.y - 15, w, 30, 15); ctx.fill(); ctx.stroke()
      ctx.fillStyle = 'rgba(15,42,68,.75)'
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
      ctx.fillText(n.l, n.x, n.y + 1)
      const pulse = (Math.sin(performance.now() / 500 + n.x) + 1) / 2
      ctx.strokeStyle = `rgba(70,189,235,${(.15 + pulse * .3).toFixed(3)})`
      ctx.beginPath(); ctx.roundRect(n.x - w / 2 - 4, n.y - 19, w + 8, 38, 19); ctx.stroke()
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 16 — Halftone en marea: puntos de imprenta cuyo tamaño fluye como el mar (inspirado en Halftone Flow) */
function halftone() {
  const { ctx } = makeCanvas()
  const GAP = 22
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const t = performance.now() / 1000
    for (let y = GAP / 2, row = 0; y < H(); y += GAP, row++) {
      const off = row % 2 ? GAP / 2 : 0
      for (let x = GAP / 2 + off; x < W(); x += GAP) {
        const v = Math.sin(x / 140 - t * .8) * Math.cos(y / 110 + t * .5) + Math.sin((x + y) / 200 + t * .6)
        const r = Math.max(0, v) * 4.4
        if (r < .3) continue
        ctx.fillStyle = `rgba(${v > 1.2 ? '70,189,235' : '27,117,183'},${(.1 + Math.min(.32, v * .16)).toFixed(3)})`
        ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill()
      }
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 18 — Blueprint: plano técnico que se dibuja solo + crosshair que sigue el cursor */
function blueprint() {
  const { ctx } = makeCanvas()
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const t = performance.now() / 1000
    // cuadrícula fina + gruesa
    ctx.strokeStyle = 'rgba(27,117,183,.06)'
    ctx.lineWidth = 1
    ctx.beginPath()
    for (let x = 0; x < W(); x += 24) { ctx.moveTo(x, 0); ctx.lineTo(x, H()) }
    for (let y = 0; y < H(); y += 24) { ctx.moveTo(0, y); ctx.lineTo(W(), y) }
    ctx.stroke()
    ctx.strokeStyle = 'rgba(27,117,183,.12)'
    ctx.beginPath()
    for (let x = 0; x < W(); x += 120) { ctx.moveTo(x, 0); ctx.lineTo(x, H()) }
    for (let y = 0; y < H(); y += 120) { ctx.moveTo(0, y); ctx.lineTo(W(), y) }
    ctx.stroke()
    // figuras que se dibujan solas (dash animado)
    const shapes = [
      { d: (c) => { c.roundRect(W() * .12, H() * .18, 190, 120, 10) }, per: 620 },
      { d: (c) => { c.arc(W() * .82, H() * .3, 85, 0, Math.PI * 2) }, per: 540 },
      { d: (c) => { c.roundRect(W() * .72, H() * .66, 230, 100, 10) }, per: 660 },
      { d: (c) => { c.arc(W() * .16, H() * .72, 65, 0, Math.PI * 2) }, per: 420 },
    ]
    for (const [i, s] of shapes.entries()) {
      ctx.strokeStyle = 'rgba(27,117,183,.4)'
      ctx.lineWidth = 1.6
      const prog = ((t * .18 + i * .3) % 1.4)
      ctx.setLineDash([s.per, s.per])
      ctx.lineDashOffset = s.per * (1 - Math.min(1, prog))
      ctx.beginPath(); s.d(ctx); ctx.stroke()
      ctx.setLineDash([])
      // cotas
      ctx.fillStyle = 'rgba(27,117,183,.4)'
      ctx.font = '10px "IBM Plex Mono", monospace'
    }
    // crosshair del cursor
    if (mouse.x > 0) {
      ctx.strokeStyle = 'rgba(70,189,235,.4)'
      ctx.lineWidth = 1
      ctx.setLineDash([6, 6])
      ctx.beginPath()
      ctx.moveTo(mouse.x, 0); ctx.lineTo(mouse.x, H())
      ctx.moveTo(0, mouse.y); ctx.lineTo(W(), mouse.y)
      ctx.stroke()
      ctx.setLineDash([])
      ctx.strokeStyle = 'rgba(27,117,183,.6)'
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 14, 0, 7); ctx.stroke()
      ctx.fillStyle = 'rgba(27,117,183,.55)'
      ctx.font = '10px "IBM Plex Mono", monospace'
      ctx.textAlign = 'left'
      ctx.fillText(`x:${Math.round(mouse.x)} y:${Math.round(mouse.y)}`, mouse.x + 20, mouse.y - 12)
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 19 — HUD Sala de Control: la página como consola de operaciones (estilo Sci-Fi FUI, adaptado a claro) */
function hud() {
  const { ctx } = makeCanvas()
  const TICKER = 'VENTAS 1.34M ▲8.2%  ·  INVENTARIO SYNC OK  ·  NÓMINA PROCESADA 214  ·  DGII e-CF ✓  ·  UPTIME 99.995%  ·  +500 EMPRESAS  ·  '
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const t = performance.now() / 1000
    const B = 'rgba(27,117,183,'
    // marco con esquinas tipo bracket
    ctx.strokeStyle = B + '.4)'
    ctx.lineWidth = 1.5
    const m = 26, L = 34
    for (const [x, y, dx, dy] of [[m, m, 1, 1], [W() - m, m, -1, 1], [m, H() - m, 1, -1], [W() - m, H() - m, -1, -1]]) {
      ctx.beginPath()
      ctx.moveTo(x + dx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * L)
      ctx.stroke()
    }
    // ticks de regla en los bordes
    ctx.strokeStyle = B + '.22)'
    ctx.lineWidth = 1
    ctx.beginPath()
    for (let x = 60; x < W() - 60; x += 30) {
      const h = x % 150 === 0 ? 10 : 5
      ctx.moveTo(x, m); ctx.lineTo(x, m + h)
      ctx.moveTo(x, H() - m); ctx.lineTo(x, H() - m - h)
    }
    for (let y = 60; y < H() - 60; y += 30) {
      const w = y % 150 === 0 ? 10 : 5
      ctx.moveTo(m, y); ctx.lineTo(m + w, y)
      ctx.moveTo(W() - m, y); ctx.lineTo(W() - m - w, y)
    }
    ctx.stroke()
    // retículas giratorias
    for (const [cx, cy, r, sp] of [[W() * .12, H() * .26, 46, .6], [W() * .88, H() * .68, 60, -.4], [W() * .82, H() * .2, 34, .8]]) {
      ctx.strokeStyle = B + '.3)'
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke()
      ctx.strokeStyle = 'rgba(70,189,235,.55)'
      ctx.lineWidth = 2
      ctx.beginPath(); ctx.arc(cx, cy, r, t * sp, t * sp + 1.1); ctx.stroke()
      ctx.lineWidth = 1
      ctx.strokeStyle = B + '.35)'
      ctx.beginPath(); ctx.arc(cx, cy, r * .6, -t * sp * 1.4, -t * sp * 1.4 + 2); ctx.stroke()
      ctx.fillStyle = B + '.5)'
      ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, 7); ctx.fill()
    }
    // barrido de escaneo vertical
    const sy = ((t * .09) % 1.3 - .15) * H()
    const g = ctx.createLinearGradient(0, sy - 60, 0, sy)
    g.addColorStop(0, 'rgba(70,189,235,0)'); g.addColorStop(1, 'rgba(70,189,235,.12)')
    ctx.fillStyle = g
    ctx.fillRect(0, sy - 60, W(), 60)
    ctx.strokeStyle = 'rgba(70,189,235,.4)'
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W(), sy); ctx.stroke()
    // marcadores parpadeantes
    for (const [x, y, ph] of [[W() * .3, H() * .82, 0], [W() * .68, H() * .14, 2], [W() * .06, H() * .5, 4]]) {
      const on = Math.sin(t * 2 + ph) > .2
      ctx.fillStyle = on ? 'rgba(70,189,235,.8)' : B + '.2)'
      ctx.fillRect(x - 3, y - 3, 6, 6)
    }
    // ticker inferior
    ctx.font = '11px "IBM Plex Mono", monospace'
    ctx.fillStyle = B + '.55)'
    ctx.textAlign = 'left'
    const tw = ctx.measureText(TICKER).width
    const off = (t * 60) % tw
    ctx.fillText(TICKER + TICKER, -off, H() - 40)
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 20 — Escáner de datos: un haz revela una matriz de datos al pasar (AI reveal) */
function scanner() {
  const { ctx } = makeCanvas()
  const CELL = 26
  const chars = []
  const glyphs = '0123456789ABCDEF$#%&+='
  const cols = () => Math.ceil(W() / CELL), rows = () => Math.ceil(H() / CELL)
  const ensure = () => {
    while (chars.length < cols() * rows()) chars.push(glyphs[Math.floor(Math.random() * glyphs.length)])
  }
  const tick = () => {
    ensure()
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const t = performance.now() / 1000
    const bx = ((t * .13) % 1.4 - .2) * W()
    ctx.font = '12px "IBM Plex Mono", monospace'
    ctx.textAlign = 'center'
    for (let cx = 0; cx < cols(); cx++) {
      const x = cx * CELL + CELL / 2
      const d = Math.abs(x - bx)
      if (d > 320) continue
      const a = Math.exp(-(d * d) / (2 * 120 * 120)) * .55
      if (a < .02) continue
      for (let cy = 0; cy < rows(); cy++) {
        if ((cx * 7 + cy * 13) % 3 === 0) continue
        const y = cy * CELL + CELL / 2
        if (Math.random() < .002) chars[cy * cols() + cx] = glyphs[Math.floor(Math.random() * glyphs.length)]
        ctx.fillStyle = `rgba(${(cx + cy) % 5 ? '27,117,183' : '70,189,235'},${a.toFixed(3)})`
        ctx.fillText(chars[cy * cols() + cx], x, y)
      }
    }
    // el haz
    const g = ctx.createLinearGradient(bx - 12, 0, bx + 12, 0)
    g.addColorStop(0, 'rgba(70,189,235,0)'); g.addColorStop(.5, 'rgba(70,189,235,.5)'); g.addColorStop(1, 'rgba(70,189,235,0)')
    ctx.fillStyle = g
    ctx.fillRect(bx - 12, 0, 24, H())
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 21 — Profundidad dimensional: capas de vidrio flotando en paralaje con el cursor */
function depth() {
  const wrap = document.createElement('div')
  wrap.className = 'fx'
  wrap.style.cssText = 'overflow:hidden;perspective:900px'
  const layers = []
  const conf = [
    { z: .25, blur: 0, n: 5, s: [90, 200], o: .5 },
    { z: .5, blur: 1, n: 4, s: [70, 150], o: .4 },
    { z: 1, blur: 2, n: 4, s: [50, 110], o: .3 },
  ]
  for (const L of conf) {
    const layer = document.createElement('div')
    layer.style.cssText = 'position:absolute;inset:-6%;will-change:transform'
    for (let i = 0; i < L.n; i++) {
      const w = L.s[0] + Math.random() * (L.s[1] - L.s[0])
      const el = document.createElement('div')
      const round = Math.random() > .5 ? '50%' : '22px'
      el.style.cssText = `position:absolute;left:${5 + Math.random() * 85}%;top:${5 + Math.random() * 80}%;width:${w}px;height:${w * (0.6 + Math.random() * .5)}px;border-radius:${round};` +
        `background:linear-gradient(135deg, rgba(70,189,235,${L.o * .28}), rgba(27,117,183,${L.o * .16}));` +
        `border:1px solid rgba(27,117,183,${L.o * .5});backdrop-filter:blur(3px);box-shadow:0 ${18 * L.z + 6}px ${40 * L.z + 14}px rgba(11,42,74,${.1 * L.z + .03})`
      layer.appendChild(el)
    }
    wrap.appendChild(layer)
    layers.push({ el: layer, z: L.z })
  }
  stage.appendChild(wrap)
  const tick = () => {
    const t = performance.now() / 1000
    const mx = mouse.x > 0 ? (mouse.x / W() - .5) : Math.sin(t * .3) * .25
    const my = mouse.y > 0 ? (mouse.y / H() - .5) : Math.cos(t * .25) * .2
    for (const L of layers) {
      L.el.style.transform = `translate3d(${-mx * 46 * L.z}px, ${-my * 34 * L.z + Math.sin(t * .6 + L.z * 5) * 6 * L.z}px, 0)`
    }
    raf = requestAnimationFrame(tick)
  }
  tick()
}

/* 22 — Holograma iridiscente: aurora evolucionada con tornasol que respira (Gradient Mesh Evolved) */
function holo() {
  const { ctx } = makeCanvas()
  const blobs = Array.from({ length: 6 }, (_, i) => ({
    ph: i * 1.3, rx: .16 + Math.random() * .3, ry: .12 + Math.random() * .28,
    r: 220 + Math.random() * 200, sp: .12 + Math.random() * .2, hue0: 185 + i * 14,
  }))
  const tick = () => {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
    ctx.clearRect(0, 0, W(), H())
    const t = performance.now() / 1000
    for (const b of blobs) {
      const x = W() * .5 + Math.cos(t * b.sp + b.ph) * W() * b.rx
      const y = H() * .5 + Math.sin(t * b.sp * 1.4 + b.ph * 2) * H() * b.ry
      const hue = b.hue0 + Math.sin(t * .3 + b.ph) * 42 // 185-255: teal ↔ azul ↔ violeta
      const g = ctx.createRadialGradient(x, y, 0, x, y, b.r)
      g.addColorStop(0, `hsla(${hue.toFixed(0)}, 78%, 60%, .30)`)
      g.addColorStop(.6, `hsla(${(hue + 24).toFixed(0)}, 70%, 62%, .12)`)
      g.addColorStop(1, 'hsla(200, 70%, 60%, 0)')
      ctx.fillStyle = g
      ctx.beginPath(); ctx.arc(x, y, b.r, 0, 7); ctx.fill()
    }
    // brillo prismático diagonal
    const sx = ((t * .05) % 1.6 - .3) * W()
    const pg = ctx.createLinearGradient(sx, 0, sx + W() * .28, H())
    pg.addColorStop(0, 'rgba(255,255,255,0)')
    pg.addColorStop(.5, 'rgba(255,255,255,.28)')
    pg.addColorStop(1, 'rgba(255,255,255,0)')
    ctx.fillStyle = pg
    ctx.fillRect(0, 0, W(), H())
    raf = requestAnimationFrame(tick)
  }
  tick()
}
